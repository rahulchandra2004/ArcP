[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcp"
version = "0.1.0"
description = "Autonomous Radial Context Pipeline: 60-FPS Frameless Polymorphic Radial Desktop Firewall, Edge-AI Sanitizer, and In-Memory DevSecOps Pipeline."
authors = [{ name = "Rahul Chandra Padamuttam (RCP)" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.4.0",
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "Pillow>=9.0.0",
    "opencv-python-headless>=4.7.0.72",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
arcp = "main:main"
